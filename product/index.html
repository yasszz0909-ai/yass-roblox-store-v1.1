<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detail Produk | Yass Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/product-detail.css">
</head>
<body class="product-page">

    <header class="detail-header">
        <button onclick="window.location.href='/'" class="back-btn">← Kembali</button>
        <button id="btn-share" class="back-btn" style="background: #007AFF; border: none; color: white;">🔗 Bagikan</button>
    </header>

    <div class="detail-img-container">
        <img id="det-img" src="" alt="Memuat...">
    </div>

    <main class="detail-info">
        <span id="det-category" class="category-badge"></span>
        <h1 id="det-title">Memuat...</h1>
        
        <div class="price-row">
            <span id="det-price" class="price-tag"></span>
            <span id="det-stock" class="stock-tag"></span>
        </div>

        <div class="detail-description">
            <h3>Deskripsi Produk</h3>
            <p id="det-note">Sedang mengambil data produk...</p>
        </div>
    </main>

    <div class="bottom-action">
        <button id="btn-order-now" class="btn-buy-full">Buat Pesanan Sekarang</button>
    </div>

    <script src="/js/products.js"></script>
    <script>
        function applyTheme() {
            const savedTheme = localStorage.getItem('yass_theme');
            if (savedTheme === 'dark') { document.body.classList.add('dark-mode'); }
        }

        function createSlug(name) {
            return name.toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();

            // Cek apakah data products berhasil dimuat
            if (typeof products === 'undefined') {
                document.getElementById('det-title').innerText = "Error: Data Gagal Dimuat";
                document.getElementById('det-note').innerText = "File products.js tidak ditemukan atau jalur salah. Pastikan src='/js/products.js'";
                return;
            }

            const pathParts = window.location.pathname.split('/');
            const currentSlug = pathParts[pathParts.length - 1];
            const p = products.find(item => createSlug(item.name) === currentSlug);

            if (p) {
                document.getElementById('det-title').innerText = p.name;
                document.getElementById('det-category').innerText = p.category;
                document.getElementById('det-img').src = `/assets/${p.img}`;
                document.getElementById('det-price').innerText = `Rp ${p.price.toLocaleString('id-ID')}`;
                document.getElementById('det-stock').innerText = `Stok: ${p.stock}`;
                document.getElementById('det-note').innerText = p.note;

                document.getElementById('btn-order-now').onclick = () => {
                    window.location.href = `/?checkout_id=${p.id}`;
                };
            } else {
                // Jika slug salah atau produk dihapus
                alert("Produk tidak ditemukan, kembali ke Beranda.");
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
