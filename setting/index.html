<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yass Roblox Store | Settings</title>
    <link rel="icon" type="image/png" href="/assets/logo.png?v=1">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .setting-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .setting-item {
            background: var(--bg-card);
            padding: 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .setting-item:active {
            transform: scale(0.98);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div>
                <h1 style="color: var(--primary); font-size: 24px;">Pengaturan</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Personalisasi & Informasi Toko</p>
            </div>
            <img src="/assets/logo.png" alt="Logo" style="width: 45px; height: 45px; border-radius: 50%;">
        </header>

        <div class="setting-list">
            <div class="setting-item">
                <span>🌙 Mode Gelap</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle" onchange="toggleTheme()">
                    <span class="slider"></span>
                </label>
            </div>

            <hr style="border: none; border-top: 1px solid rgba(0,0,0,0.05); margin: 10px 0;">

            <a href="/about-us" class="setting-item">
                <span>ℹ️ Tentang Yass Store</span>
                <span>❯</span>
            </a>

            <a href="/terms-of-service" class="setting-item">
                <span>📜 Aturan Penggunaan</span>
                <span>❯</span>
            </a>

            <a href="/privacy-policy" class="setting-item">
                <span>🛡️ Kebijakan Privasi</span>
                <span>❯</span>
            </a>
        </div>

        <div style="text-align: center; margin-top: 50px; color: var(--text-muted); font-size: 12px;">
            Yass Store v1.1.0<br>
            Made by Yass
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <span>🏠</span>
            <span>Home</span>
        </a>
        <a href="/setting" class="nav-item active">
            <span>⚙️</span>
            <span>Setting</span>
        </a>
    </nav>

    <script>
        // Logika Dark Mode Khusus di Halaman Setting
        const toggle = document.getElementById('darkModeToggle');
        
        // Cek status tema saat halaman dimuat
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            toggle.checked = true;
        }

        function toggleTheme() {
            if (toggle.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
</body>
</html>
