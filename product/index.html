<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detail Produk | Yass Store</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/product-detail.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="product-page">

    <header class="detail-header">
        <button onclick="window.location.href='/'" class="back-btn">← Kembali</button>
        <button id="btn-share" class="back-btn" style="background: #007AFF; border: none; color: white;">🔗 Bagikan</button>
    </header>

    <div class="detail-img-container">
        <img id="det-img" src="" alt="Memuat Gambar...">
    </div>

    <main class="detail-info">
        <span id="det-category" class="category-badge">KATEGORI</span>
        <h1 id="det-title">Nama Produk</h1>
        
        <div class="price-row">
            <span id="det-price" class="price-tag">Rp 0</span>
            <span id="det-stock" class="stock-tag">Stok: 0</span>
        </div>

        <div class="detail-description">
            <h3>Deskripsi Produk</h3>
            <p id="det-note">Memuat informasi produk...</p>
        </div>
    </main>

    <div class="bottom-action">
        <button id="btn-order-now" class="btn-buy-full">Buat Pesanan Sekarang</button>
    </div>

    <script src="/js/products.js"></script>
    <script>
        // 1. Fungsi Sinkronisasi Tema
        function applyTheme() {
            const savedTheme = localStorage.getItem('yass_theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        // 2. Fungsi Membuat Slug (Identik dengan script.js)
        function createSlug(name) {
            return name.toLowerCase()
                .replace(/[^a-z0-9 -]/g, '') 
                .replace(/\s+/g, '-')       
                .replace(/-+/g, '-');       
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Jalankan tema sebelum render konten
            applyTheme(); 

            // Tangkap Slug dari URL
            const pathParts = window.location.pathname.split('/');
            const currentSlug = pathParts[pathParts.length - 1];

            // Cari produk yang cocok
            const p = products.find(item => createSlug(item.name) === currentSlug);

            if (p) {
                // Isi Data Produk
                document.title = `${p.name} | Yass Store`;
                document.getElementById('det-title').innerText = p.name;
                document.getElementById('det-category').innerText = p.category;
                document.getElementById('det-img').src = `/assets/${p.img}`;
                document.getElementById('det-price').innerText = `Rp ${p.price.toLocaleString('id-ID')}`;
                document.getElementById('det-stock').innerText = `Stok: ${p.stock}`;
                document.getElementById('det-note').innerText = p.note;

                // Proteksi Stok Habis
                if (p.stock <= 0) {
                    const btn = document.getElementById('btn-order-now');
                    btn.innerText = "Stok Habis";
                    btn.style.opacity = "0.5";
                    btn.disabled = true;
                }

                // Aksi Tombol Order (Balik ke Home + Trigger Modal)
                document.getElementById('btn-order-now').onclick = () => {
                    window.location.href = `/?checkout_id=${p.id}`;
                };

                // Aksi Tombol Bagikan
                document.getElementById('btn-share').onclick = async () => {
                    try {
                        if (navigator.share) {
                            await navigator.share({
                                title: p.name + " - Yass Store",
                                url: window.location.href
                            });
                        } else {
                            navigator.clipboard.writeText(window.location.href);
                            alert("Link produk disalin ke clipboard!");
                        }
                    } catch (err) { console.log(err); }
                };
            } else {
                // Jika slug tidak valid, lempar ke beranda
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
